<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – CateMate</title>
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <v-app>
      <app-nav current="login"></app-nav>

      <v-main>
        <v-container class="d-flex align-center justify-center" style="min-height: 80vh;">
          <v-card width="420" elevation="4" rounded="lg">
            <v-card-title class="text-h5 pt-6 px-6">Login</v-card-title>
            <v-card-text class="px-6">
              <v-alert v-if="error" type="error" variant="tonal" class="mb-4">{{ error }}</v-alert>

              <v-text-field
                v-model="email"
                label="Email"
                type="email"
                prepend-inner-icon="mdi-email-outline"
                variant="outlined"
                class="mb-3"
              ></v-text-field>

              <v-text-field
                v-model="password"
                label="Password"
                :type="showPassword ? 'text' : 'password'"
                prepend-inner-icon="mdi-lock-outline"
                :append-inner-icon="showPassword ? 'mdi-eye-off' : 'mdi-eye'"
                @click:append-inner="showPassword = !showPassword"
                variant="outlined"
                @keyup.enter="login"
              ></v-text-field>
            </v-card-text>

            <v-card-actions class="px-6 pb-6 flex-column ga-2">
              <v-btn
                color="primary"
                size="large"
                block
                :loading="loading"
                @click="login"
              >
                Login
              </v-btn>
              <p class="text-body-2 text-center mt-2">
                Don't have an account? <a href="/register.html">Register</a>
              </p>
            </v-card-actions>
          </v-card>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.js"></script>
  <script src="/shared.js"></script>
  <script>
    const { createApp } = Vue
    const vuetify = cmVuetify()

    createApp({
      data() {
        return {
          email: '',
          password: '',
          showPassword: false,
          loading: false,
          error: '',
        }
      },
      methods: {
        async login() {
          this.error = ''
          this.loading = true
          try {
            // OAuth2PasswordRequestForm requires form-encoded data, with field name "username"
            const body = new URLSearchParams()
            body.append('username', this.email)
            body.append('password', this.password)

            const res = await fetch('/owners/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: body.toString(),
            })

            if (!res.ok) {
              const data = await res.json()
              this.error = data.detail || 'Login failed'
              return
            }

            const data = await res.json()
            localStorage.setItem('cm_token', data.access_token)
            window.location.href = '/my-cats.html'
          } catch (e) {
            this.error = 'Network error. Is the server running?'
          } finally {
            this.loading = false
          }
        },
      },
    }).use(vuetify).component('app-nav', CmNav).mount('#app')
  </script>
</body>
</html>
