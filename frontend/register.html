<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – CateMate</title>
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <v-app>
      <app-nav current="register"></app-nav>

      <v-main>
        <v-container class="d-flex align-center justify-center py-8">
          <v-card width="480" elevation="4" rounded="lg">
            <v-card-title class="text-h5 pt-6 px-6">Create an account</v-card-title>
            <v-card-text class="px-6">
              <v-alert v-if="error" type="error" variant="tonal" class="mb-4">{{ error }}</v-alert>
              <v-alert v-if="success" type="success" variant="tonal" class="mb-4">{{ success }}</v-alert>

              <v-text-field v-model="form.name" label="Full name" prepend-inner-icon="mdi-account-outline" variant="outlined" class="mb-3"></v-text-field>
              <v-text-field v-model="form.email" label="Email" type="email" prepend-inner-icon="mdi-email-outline" variant="outlined" class="mb-3"></v-text-field>
              <v-text-field
                v-model="form.password"
                label="Password"
                :type="showPassword ? 'text' : 'password'"
                prepend-inner-icon="mdi-lock-outline"
                :append-inner-icon="showPassword ? 'mdi-eye-off' : 'mdi-eye'"
                @click:append-inner="showPassword = !showPassword"
                variant="outlined"
                class="mb-3"
              ></v-text-field>

              <v-row>
                <v-col cols="6">
                  <v-select
                    v-model="form.gender"
                    label="Gender"
                    :items="genderOptions"
                    variant="outlined"
                  ></v-select>
                </v-col>
                <v-col cols="6">
                  <v-text-field v-model.number="form.age" label="Age" type="number" variant="outlined"></v-text-field>
                </v-col>
              </v-row>

              <v-select
                v-model="form.city_id"
                label="City"
                :items="cities"
                item-title="name"
                item-value="id"
                prepend-inner-icon="mdi-city-variant-outline"
                variant="outlined"
                :loading="loadingCities"
                class="mb-3"
              ></v-select>

              <v-expansion-panels class="mb-3">
                <v-expansion-panel>
                  <v-expansion-panel-title @click="onLocationPanel">
                    <v-icon icon="mdi-map-marker-outline" class="mr-2"></v-icon>
                    Set my approximate location (optional)
                  </v-expansion-panel-title>
                  <v-expansion-panel-text>
                    <div v-if="!form.city_id" class="text-body-2 mb-2">Choose a city first.</div>
                    <div id="map" style="height:260px;border-radius:8px;" v-show="form.city_id"></div>
                    <div class="text-caption mt-2">{{ hint }}</div>
                    <div class="d-flex align-center mt-2">
                      <span class="text-body-2">{{ form.latitude != null ? 'Spot picked' : 'No spot picked: your city centre will be used.' }}</span>
                      <v-spacer></v-spacer>
                      <v-btn v-if="form.latitude != null" size="small" variant="text" @click="clearPin">Use city centre</v-btn>
                    </div>
                  </v-expansion-panel-text>
                </v-expansion-panel>
              </v-expansion-panels>

              <v-select
                v-model="form.allow_message_from"
                label="Allow messages from"
                :items="['Everyone', 'Same_Gender']"
                variant="outlined"
              ></v-select>
            </v-card-text>

            <v-card-actions class="px-6 pb-6 flex-column ga-2">
              <v-btn color="primary" size="large" block :loading="loading" @click="register">
                Register
              </v-btn>
              <p class="text-body-2 text-center mt-2">
                Already have an account? <a href="/login.html">Login</a>
              </p>
            </v-card-actions>
          </v-card>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/shared.js"></script>
  <script>
    const { createApp } = Vue
    const vuetify = cmVuetify()

    createApp({
      data() {
        return {
          form: {
            name: '',
            email: '',
            password: '',
            gender: 'prefer_not_to_say',
            age: null,
            city_id: null,
            latitude: null,
            longitude: null,
            allow_message_from: 'Everyone',
          },
          genderOptions: ['male', 'female', 'non-binary', 'Other', 'prefer_not_to_say'],
          cities: [],
          hint: CM_LOCATION_HINT,
          picker: null,
          loadingCities: true,
          loading: false,
          showPassword: false,
          error: '',
          success: '',
        }
      },
      async mounted() {
        try {
          const res = await fetch('/cities/')
          this.cities = await res.json()
        } finally {
          this.loadingCities = false
        }
      },
      watch: {
        'form.city_id'() {
          // A pin picked for another city no longer fits.
          this.clearPin()
          const c = this.selectedCity()
          if (this.picker && c) this.picker.setCity(c.latitude, c.longitude)
        },
      },
      methods: {
        selectedCity() {
          return this.cities.find(c => c.id === this.form.city_id)
        },
        async onLocationPanel() {
          // The map needs a visible element, so create it when the panel opens.
          await this.$nextTick()
          setTimeout(() => {
            const c = this.selectedCity()
            if (!this.picker) {
              this.picker = cmLocationPicker('map', {
                lat: this.form.latitude, lng: this.form.longitude,
                cityLat: c && c.latitude, cityLng: c && c.longitude,
                onChange: (la, ln) => { this.form.latitude = la; this.form.longitude = ln },
              })
            }
            this.picker.invalidate && this.picker.invalidate()
            if (c) this.picker.setCity(c.latitude, c.longitude)
          }, 300)
        },
        clearPin() {
          this.form.latitude = null
          this.form.longitude = null
          if (this.picker) this.picker.setPin(null, null)
        },
        async register() {
          this.error = ''
          this.success = ''
          this.loading = true
          try {
            const res = await fetch('/owners/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form),
            })
            const data = await res.json()
            if (!res.ok) {
              this.error = data.detail || 'Registration failed'
              return
            }
            this.success = 'Account created! Redirecting to login...'
            setTimeout(() => { window.location.href = '/login.html' }, 1500)
          } catch (e) {
            this.error = 'Network error. Is the server running?'
          } finally {
            this.loading = false
          }
        },
      },
    }).use(vuetify).component('app-nav', CmNav).mount('#app')
  </script>
</body>
</html>
