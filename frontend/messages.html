<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages – CateMate</title>
  <link href="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <v-app>
      <app-nav current="messages"></app-nav>

      <v-main>
        <v-container class="py-8" style="max-width: 760px;">
          <h1 class="text-h5 font-weight-bold mb-6">
            <v-icon icon="mdi-email" class="mr-2"></v-icon>Messages
          </h1>

          <v-progress-circular v-if="loading" indeterminate color="primary" class="d-block mx-auto"></v-progress-circular>

          <v-card v-else-if="conversations.length > 0" rounded="lg" elevation="2">
            <v-list lines="two">
              <template v-for="(conv, i) in conversations" :key="conv.otherId">
                <v-list-item :href="`/chat.html?user=${conv.otherId}`">
                  <template v-slot:prepend>
                    <v-avatar color="pink">
                      <span class="text-white">{{ initials(ownerName(conv.otherId)) }}</span>
                    </v-avatar>
                  </template>
                  <v-list-item-title class="font-weight-medium">{{ ownerName(conv.otherId) }}</v-list-item-title>
                  <v-list-item-subtitle>
                    <span v-if="conv.last.sender_id === me" class="text-medium-emphasis">You: </span>{{ conv.last.content }}
                  </v-list-item-subtitle>
                  <template v-slot:append>
                    <div class="text-caption text-medium-emphasis">{{ formatDate(conv.last.created_at) }}</div>
                  </template>
                </v-list-item>
                <v-divider v-if="i < conversations.length - 1"></v-divider>
              </template>
            </v-list>
          </v-card>

          <v-empty-state
            v-else
            icon="mdi-email-outline"
            title="No messages yet"
            text="When you message an owner from Browse, the conversation shows up here."
          >
            <template v-slot:actions>
              <v-btn color="primary" href="/browse.html">Browse cats</v-btn>
            </template>
          </v-empty-state>
        </v-container>
      </v-main>
    </v-app>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuetify@3/dist/vuetify.min.js"></script>
  <script src="/shared.js"></script>
  <script>
    const { createApp } = Vue
    const vuetify = cmVuetify()

    createApp({
      data() {
        return {
          me: null,
          messages: [],
          owners: {},
          loading: true,
        }
      },
      computed: {
        // One entry per other owner, holding that thread's most recent message.
        // Messages arrive newest-first, so the first one seen per owner is latest.
        conversations() {
          const seen = new Map()
          for (const msg of this.messages) {
            const otherId = msg.sender_id === this.me ? msg.recipient_id : msg.sender_id
            if (!seen.has(otherId)) seen.set(otherId, { otherId, last: msg })
          }
          return Array.from(seen.values())
        },
      },
      async mounted() {
        const token = localStorage.getItem('cm_token')
        if (!token) { window.location.href = '/login.html'; return }
        this.me = this.decodeOwnerId(token)
        await Promise.all([this.fetchMessages(), this.fetchOwners()])
        this.loading = false
      },
      methods: {
        authHeader() {
          return { Authorization: `Bearer ${localStorage.getItem('cm_token')}` }
        },
        decodeOwnerId(token) {
          try {
            const payload = JSON.parse(atob(token.split('.')[1]))
            return parseInt(payload.sub)
          } catch (e) { return null }
        },
        ownerName(id) {
          return this.owners[id] || `owner #${id}`
        },
        initials(name) {
          return (name || '?').trim().charAt(0).toUpperCase()
        },
        formatDate(iso) {
          const d = new Date(iso)
          return isNaN(d) ? '' : d.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
        },
        async fetchMessages() {
          const res = await fetch('/messages/', { headers: this.authHeader() })
          if (res.status === 401) { window.location.href = '/login.html'; return }
          this.messages = await res.json()
        },
        async fetchOwners() {
          const res = await fetch('/owners/')
          if (!res.ok) return
          const owners = await res.json()
          this.owners = Object.fromEntries(owners.map(o => [o.id, o.name]))
        },
      },
    }).use(vuetify).component('app-nav', CmNav).mount('#app')
  </script>
</body>
</html>
